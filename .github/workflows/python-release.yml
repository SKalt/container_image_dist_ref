name: Release Python

# Pushing a tag like v0.3.0 builds the sdist and platform wheels and publishes
# them to PyPI with trusted publishing. Manual runs publish the same artifacts
# to TestPyPI, which is useful for checking the release pipeline.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publishing must be gated on the Rust and Python workflows passing. GitHub
  # Actions has no cross-workflow `needs`, so they are exposed as reusable
  # workflows and called here.
  rust:
    name: Rust checks
    uses: ./.github/workflows/rust.yml
    permissions:
      contents: read
      issues: write

  python:
    name: Python checks
    uses: ./.github/workflows/python.yml

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify package versions match the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/check_release_versions.sh
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sdist
        run: uv build --sdist --out-dir dist
        working-directory: bindings/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Build ${{ matrix.name }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      # Where the `target` values come from:
      # https://doc.rust-lang.org/nightly/rustc/platform-support.html
      # (or run `rustc --print target-list`).
      # maturin-action `target` and `manylinux` inputs:
      # https://github.com/PyO3/maturin-action#inputs
      # manylinux and musllinux tags:
      # https://github.com/PyO3/maturin-action#manylinux-docker-container
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
          - name: musllinux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: "musllinux_1_2"
          - name: musllinux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: "musllinux_1_2"
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "auto"
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "auto"
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "auto"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
          working-directory: bindings/python
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [rust, python, sdist, wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/container-image-dist-ref/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always 'dist/*'

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [rust, python, sdist, wheels]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/container_image_dist_ref/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - name: Publish to TestPyPI
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/ 'dist/*'
