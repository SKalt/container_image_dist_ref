[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "container-image-dist-ref"
version = "0.3.0"
description = "Parse and validate docker/OCI container image references."
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["docker", "oci", "container", "image", "reference"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]
readme = "./README.md"

[tool.maturin]
module-name = "container_image_dist_ref._native"
python-source = "python"
features = ["extension-module"]

[tool.ruff]
line-length = 88
target-version = "py39"
# Keep the hand-aligned comments in the Markdown examples out of the formatter.
extend-exclude = ["*.md"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.17.5",
]
