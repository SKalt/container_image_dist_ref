name: Python

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.python-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: bindings/python/uv.lock
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the package and dev dependencies
        run: uv sync --locked --group dev
        working-directory: bindings/python
      - name: Run tests
        run: uv run --locked pytest tests -q
        working-directory: bindings/python

  wheel:
    name: Test built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: bindings/python/uv.lock
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist
          working-directory: bindings/python
          manylinux: auto
      - name: Install wheel and pytest with uv
        run: |
          uv venv
          uv pip install dist/*.whl pytest
        working-directory: bindings/python
      - name: Run tests against the installed wheel
        run: uv run --no-project pytest tests -q
        working-directory: bindings/python
